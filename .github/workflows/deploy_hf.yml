name: Deploy to Hugging Face Spaces

# Auto-deploy the project to a Hugging Face Space on every push to main.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   HF_TOKEN         — Hugging Face write token (https://huggingface.co/settings/tokens)
#                      Scope: "Write access to contents/settings of all repos under your namespace"
# Required repository variables (Settings → Secrets and variables → Actions → Variables):
#   HF_USERNAME      — your HF username (e.g. "OmarGamal48812")
#   HF_SPACE_NAME    — the Space name (e.g. "niletel-rag-support")
#
# One-time setup: create the Space in the HF UI first (SDK = Docker), then
# this workflow will keep it in sync with main.
#
# The runtime secrets (LIGHTNING_API_KEY, LANGFUSE_*, N8N_WEBHOOK_URL, ...)
# live INSIDE the Space — Settings → Repository secrets — and are NOT
# duplicated here.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hf-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Sync to HF Space
    runs-on: ubuntu-latest
    if: ${{ vars.HF_USERNAME != '' && vars.HF_SPACE_NAME != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is not set. See workflow header for setup instructions."
            exit 1
          fi

      - name: Clone the target HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
        run: |
          git clone "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}" hf-space

      - name: Stage the deploy
        run: |
          chmod +x scripts/deploy_hf.sh
          ./scripts/deploy_hf.sh hf-space

      - name: Commit & push to Space
        working-directory: hf-space
        run: |
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi
          git commit -m "Deploy from GitHub @ ${{ github.sha }}"
          git push
