name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.5.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: uv tool install ruff
      - name: Ruff check
        run: uv tool run ruff check src/ api/ app/ scripts/ tests/
      - name: Ruff format check
        run: uv tool run ruff format --check src/ api/ app/ scripts/ tests/
        continue-on-error: true   # advisory until the codebase is fully formatted

  test:
    name: Pytest (unit)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install project + deps
        run: uv sync --frozen --no-dev
      - name: Install pytest extras
        run: uv pip install pytest pytest-asyncio
      - name: Run unit tests
        env:
          # Stub keys — every test in tests/ uses mocks/patches, but module
          # import paths sometimes touch pydantic-settings, so set placeholders.
          LLM_PROVIDER: lightning
          LIGHTNING_API_KEY: ci-stub
          LIGHTNING_BASE_URL: https://example.invalid/v1/
          LIGHTNING_MODEL: ci-stub-model
          GROQ_API_KEY: ci-stub
          DEEPSEEK_API_KEY: ci-stub
          OPENAI_API_KEY: ci-stub
          TAVILY_API_KEY: ci-stub
          LANGFUSE_ENABLED: "false"
          # Keep ON so test_prometheus_metrics_endpoint can assert /metrics is mounted.
          PROMETHEUS_ENABLED: "true"
          N8N_WEBHOOK_URL: https://example.invalid/webhook/niletel-ticket
          PII_REDACTION_ENABLED: "true"
          SEMANTIC_CACHE_ENABLED: "false"
          CITATIONS_ENABLED: "true"
          TOOL_AGENT_ENABLED: "false"
          TRIAD_EVAL_ENABLED: "false"
          CONTEXTUAL_RETRIEVAL: "false"
          LONG_CONTEXT_REORDER: "true"
          RERANKER_ENABLED: "false"
        run: uv run pytest tests/ -v --tb=short -m "not live"

  docker:
    name: Docker build smoke
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build api image (smoke — no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: api
          push: false
          load: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build streamlit image (smoke — no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: streamlit
          push: false
          load: false
          cache-from: type=gha,scope=streamlit
          cache-to: type=gha,scope=streamlit,mode=max
