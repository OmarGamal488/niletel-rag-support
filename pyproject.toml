[project]
name = "niletel-rag-support"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "ag-ui-langgraph>=0.0.35",
    "chromadb>=1.5.9",
    "copilotkit>=0.1.88",
    "dspy-ai>=3.2.1",
    "fastapi>=0.136.1",
    "groq>=1.2.0",
    "httpx>=0.28.1",
    "langchain>=1.2.17",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.2.1",
    "langfuse>=4.6.1",
    "langgraph>=1.1.10",
    "langsmith>=0.8.2",
    "openai>=2.35.0",
    "prometheus-client>=0.25.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.2",
    "ragas>=0.3.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.4.1",
    "streamlit>=1.57.0",
    "streamlit-elements>=0.1.0",
    "streamlit-shadcn-ui>=0.1.19",
    "uvicorn[standard]>=0.46.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    ".venv",
    "data/chroma_db",
    "frontend/node_modules",
    "huggingface",
]

[tool.ruff.lint]
# E (pycodestyle errors), F (pyflakes), I (isort), W (warnings), UP (pyupgrade), B (bugbear)
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI/Pydantic use function-call defaults intentionally
]

[tool.ruff.lint.per-file-ignores]
# Streamlit entrypoint injects sys.path before importing project modules — by design.
"app/streamlit_app.py" = ["E402"]
# Tests can keep loose-fixture imports / unused variables in arrange blocks.
"tests/**/*.py" = ["F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that require external infrastructure (LLM, n8n, Tavily). Excluded in CI.",
]
